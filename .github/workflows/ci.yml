name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is intended but not yet green: MSVC reports C4244,
        # C4267 and C4996 across the sources, and the test target compiles
        # with /W4 /WX. Add it back after that portability pass.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # SDL2 is only required by the showcase, which this workflow does not build.
      - name: Configure with the reference-renderer tests enabled
        run: cmake -S lib/libdisplacer-native -B lib/libdisplacer-native/build -DDISPLACER_TESTS=ON
      - name: Build
        run: cmake --build lib/libdisplacer-native/build --config Debug
      - name: Compare optimized drawing against the reference renderer
        run: ctest --test-dir lib/libdisplacer-native/build --build-config Debug --output-on-failure

  rust:
    name: Rust bindings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is intended but not yet green: MSVC reports C4244,
        # C4267 and C4996 across the sources, and the test target compiles
        # with /W4 /WX. Add it back after that portability pass.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The crate compiles the sibling native sources through `cc`, so it needs
      # the checkout's C compiler and the root VERSION file, not a published crate.
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - name: Test canvas, themes, fonts, and ownership constraints
        # No Cargo.lock is tracked for this path-dependency crate, so
        # --locked cannot be satisfied here.
        run: cargo +1.85 test --manifest-path lib/libdisplacer-rs/Cargo.toml

  web:
    name: Web components
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lib/libdisplacer-ts/package-lock.json
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
        working-directory: lib/libdisplacer-ts
      # `npm run build` type-checks with tsc and bundles with Vite. The package
      # also declares `test` and Storybook scripts, but neither a web unit-test
      # suite nor a Storybook configuration ships in this repository yet.
      - name: Type-check and bundle
        run: npm run build
        working-directory: lib/libdisplacer-ts
